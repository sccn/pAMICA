name: Release binaries

# Builds the dependency-free native AMICA binary (epic #165) for every supported
# target and attaches the checksummed binaries to the GitHub release. Each target
# builds NATIVELY on its own runner via native/build.sh (the single-rank MPI shim
# means no MPI runtime is needed) and is smoke-tested on real sample EEG before
# upload, so a binary that cannot run on its platform fails the job.
#
# The Linux targets build inside a Rocky Linux 8 container (glibc 2.28), not on the
# runner's own distribution: a binary needs at least the glibc it was built against,
# and the runner image's is far newer than Red Hat Enterprise Linux 8 and its
# rebuilds, which many compute clusters run (issue #370). native/check_glibc_floor.sh
# fails the job if that floor is ever exceeded again.
#
# Run manually (workflow_dispatch) to validate without cutting a release; assets
# are only attached when triggered by a published release.

on:
  release:
    types: [published]
  workflow_dispatch:
  # A change to the recipe builds every target without publishing anything (assets
  # attach only for a published release), so a broken Linux container build or a glibc
  # floor regression shows up on the pull request instead of at the next release.
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/release-binaries.yml'

permissions:
  contents: write  # upload release assets

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-26
            shell: bash
          - target: linux-x64
            runner: ubuntu-latest
            container: rockylinux:8
            shell: bash
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            container: rockylinux:8
            shell: bash
          - target: windows-x64
            runner: windows-latest
            shell: 'msys2 {0}'
            msystem: MINGW64
          - target: windows-arm64
            runner: windows-11-arm
            shell: 'msys2 {0}'
            msystem: CLANGARM64
            experimental: true
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      # --- Toolchain per platform ------------------------------------------
      - name: Set up toolchain (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: brew install gcc  # gfortran + libgomp; LAPACK via Accelerate

      - name: Set up toolchain (Linux, Rocky Linux 8 container)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          dnf -y install dnf-plugins-core
          dnf config-manager --set-enabled powertools
          # gcc-toolset-13 supplies a gfortran new enough for -fallow-argument-mismatch
          # (the system gfortran is 8.5). openblas-static is the serial flavor and
          # carries both BLAS and LAPACK: Rocky 8 packages no static reference BLAS.
          dnf -y install gcc-toolset-13-gcc-gfortran openblas-static python3 binutils

      - name: Set up toolchain (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          # OpenBLAS provides both BLAS and LAPACK. The package prefix differs by
          # environment (mingw-w64-x86_64-* vs mingw-w64-clang-aarch64-*).
          # gcc-fortran (gfortran + gcc/cc), openblas (BLAS+LAPACK), python (for
          # patch_sources.py). Package prefix differs by environment.
          install: >-
            ${{ matrix.msystem == 'CLANGARM64'
              && 'mingw-w64-clang-aarch64-gcc-fortran mingw-w64-clang-aarch64-openblas mingw-w64-clang-aarch64-python'
              || 'mingw-w64-x86_64-gcc-fortran mingw-w64-x86_64-openblas mingw-w64-x86_64-python' }}

      # --- Build -----------------------------------------------------------
      - name: Build native binary
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            macos-*)
              # Accelerate is a system framework (always present); static Fortran
              # runtime leaves only Accelerate + libSystem as dependencies.
              export LAPACK_LIBS="-framework Accelerate"
              export EXTRA_LDFLAGS="-static-libquadmath"
              ;;
            linux-*)
              # Static OpenBLAS (BLAS + LAPACK), Fortran runtime and OpenMP runtime;
              # only glibc stays dynamic, and the container pins its floor at 2.28.
              # libgomp is linked from its archive because the toolset's libgomp.so
              # resolves to the system's GCC 8 libgomp.so.1, older than the code the
              # toolset emits; libgomp.a calls dlopen (offload plugins), hence -ldl,
              # and --as-needed then drops the now-unused libgomp.so.1 dependency.
              source /opt/rh/gcc-toolset-13/enable
              export LAPACK_LIBS="-l:libopenblas.a"
              export EXTRA_LDFLAGS="-static-libquadmath $(gfortran -print-file-name=libgomp.a) -ldl -Wl,--as-needed"
              ;;
            windows-*)
              # OpenBLAS (static archive) supplies BLAS+LAPACK; -static bundles the
              # MinGW runtime so the .exe has no MSYS2 DLL dependencies.
              export LAPACK_LIBS="-l:libopenblas.a"
              export EXTRA_LDFLAGS="-static"
              ;;
          esac
          bash native/build.sh
          # Static OpenBLAS carries kernels for every CPU generation (46 MB on x86-64);
          # dropping the symbols halves that without touching the code.
          if [ "${{ runner.os }}" = "Linux" ]; then strip -s native/amica15_shim; fi
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          mkdir -p dist
          cp "native/amica15_shim$ext" "dist/amica15-${{ matrix.target }}$ext"

      # --- glibc floor: the binary must load on a glibc 2.28 host -----------
      # The allowed libraries are the glibc ones; libgomp.so.1 and libgfortran.so.5 must stay
      # inside the binary, because the host may not have them or may have an older one.
      - name: Check the glibc floor and shared libraries
        if: runner.os == 'Linux'
        run: |
          bash native/check_glibc_floor.sh "dist/amica15-${{ matrix.target }}" 2.28 \
            '^(libc|libm|libdl|libpthread|libmvec|librt)\.so\.|^ld-linux'

      # --- Smoke test: the binary must actually run on this platform --------
      - name: Smoke test on sample EEG
        run: |
          set -euo pipefail
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          bin="$PWD/dist/amica15-${{ matrix.target }}$ext"
          run="$(mktemp -d)"; cd "$run"
          cp "$GITHUB_WORKSPACE/pamica/sample_data/eeglab_data.fdt" .
          mkdir -p out
          sed -e 's#^files .*#files ./eeglab_data.fdt#' \
              -e 's#^outdir .*#outdir ./out/#' \
              -e 's#^max_iter .*#max_iter 2#' -e 's#^writestep .*#writestep 2#' \
              -e 's#^max_threads .*#max_threads 2#' \
              "$GITHUB_WORKSPACE/pamica/sample_data/input.param" > p.param
          "$bin" p.param | tee run.log
          # Extract the last iteration's LL. A finite negative number (starts with
          # "-<digit>") = a working decomposition; a blank, "NaN" or "Infinity"
          # extraction, or a positive value, fails the pattern below.
          ll="$(grep -oE 'LL = *-?[0-9.]+' run.log | tail -1 | grep -oE '\-?[0-9.]+$' || true)"
          echo "final LL = '$ll'"
          case "$ll" in
            -[0-9]*) echo "smoke test OK (LL=$ll)" ;;
            *) echo "smoke test FAILED: LL='$ll' (expected finite negative)"; exit 1 ;;
          esac

      # --- Checksum + upload -----------------------------------------------
      - name: Checksum
        run: |
          set -euo pipefail
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum amica15-* > "amica15-${{ matrix.target }}.sha256"
          else
            shasum -a 256 amica15-* > "amica15-${{ matrix.target }}.sha256"
          fi
          cat "amica15-${{ matrix.target }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: amica15-${{ matrix.target }}
          path: dist/*

  publish:
    name: Attach binaries to release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -R dist
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/amica15-* --clobber --repo "${{ github.repository }}"
